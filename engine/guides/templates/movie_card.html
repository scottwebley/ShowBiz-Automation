<article class="movie-card">

    <div class="movie-poster">

        <img
            src="${poster}"
            alt="${title}">

    </div>

    <div class="movie-info">

        <h2>${title}</h2>

        <p class="release-date">
            ${release_date}
        </p>

        <div class="movie-description">
            ${description}
        </div>

        <div class="movie-buttons">

            <a
                href="${trailer_url}"
                target="_blank"
                class="button trailer">

                ▶ Watch Trailer

            </a>

        </div>

    </div>

</article>
